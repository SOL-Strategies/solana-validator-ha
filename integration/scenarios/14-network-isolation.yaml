name: network-isolation
description: >
  An active validator whose cluster RPC fails while it keeps receiving blocks (an RPC provider
  outage) stays active. Once it also stops receiving blocks it has lost the network, so it
  demotes itself and a passive takes over.

initial_state:
  active_validator: validator-1

steps:
  - name: assert initial state
    action: assert
    timeout: 30s
    active_count: 1
    state:
      validator-1:
        role: active

  - name: cluster RPC fails for the active, its local slot keeps moving
    action: fail_cluster_rpc
    target: validator-1

  - name: wait longer than the leaderless threshold and the local slot stall duration
    action: wait
    duration: 25s

  - name: an RPC provider outage does not demote the active
    action: assert
    timeout: 10s
    active_count: 1
    state:
      validator-1:
        role: active

  - name: the active loses the network
    action: isolate
    target: validator-1

  - name: the isolated active demotes itself and a passive takes over
    action: assert
    timeout: 60s
    active_count: 1
    state:
      validator-1:
        role: passive

  - name: restore the network
    action: restore_network
    target: validator-1
