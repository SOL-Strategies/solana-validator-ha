validator:
  name: "validator-1"
  rpc_url: "http://mock-solana:8899?validator=validator-1"
  public_ip_service_urls: ["http://mock-solana:8899/public-ip"]
  identities:
    passive_pubkey: "AP4JyZq2vuN4u64FGFHTwdG11xHu1vZWVYQj21MPLrnw"

cluster:
  name: "mainnet-beta"
  rpc_urls: ["http://mock-cluster:8899"]

prometheus:
  port: 9090
  static_labels:
    environment: "integration-test"
    validator: "validator-1"

failover:
  poll_interval_duration: "3s"
  leaderless_samples_threshold: 3  # 3 × 3s = 9s before failover

  self_healthy:
    minimum_duration: "5s"       # short for fast integration tests (default is 30s)
    poll_interval_duration: "2s"

  # When becoming active, tell the mock server so getIdentity returns the active pubkey.
  # isSelfActive() then confirms success and the metrics role flips to "active".
  active:
    command: "curl"
    args:
      - "-sf"
      - "-X"
      - "POST"
      - "-H"
      - "Content-Type: application/json"
      - "-d"
      - '{"action":"set_active","target":"{{ .SelfName }}","profile":"{{ .ProfileName }}"}'
      - "http://mock-solana:8899/action"

  # When becoming passive, tell the mock server. If this validator was active, the mock
  # clears the active slot; getIdentity then returns the passive pubkey confirming the transition.
  passive:
    command: "curl"
    args:
      - "-sf"
      - "-X"
      - "POST"
      - "-H"
      - "Content-Type: application/json"
      - "-d"
      - '{"action":"set_passive","target":"{{ .SelfName }}","profile":"{{ .ProfileName }}"}'
      - "http://mock-solana:8899/action"

profiles:
  main:
    priority: 0
    identities:
      active_pubkey: "ArkzFExXXHaA6izkNhTJJ5zpXdQpynffjfRMJu4Yq6H"
    vote_pubkey: "ArkzFExXXHaA6izkNhTJJ5zpXdQpynffjfRMJu4Yq6H"
    authorized_voter: "ArkzFExXXHaA6izkNhTJJ5zpXdQpynffjfRMJu4Yq6H"
    # Self-inclusive HA group. IPs must match the mock /public-ip service.
    peers:
      validator-1:
        ip: "10.0.0.100"
      validator-2:
        ip: "10.0.0.101"
      validator-3:
        ip: "10.0.0.102"
