validator:
  name: "validator-1"
  rpc_url: "http://localhost:8899?validator=validator-1"
  public_ip_service_urls: ["http://localhost:8899/public-ip?validator=validator-1"]
  identities:
    passive_pubkey: "AP4JyZq2vuN4u64FGFHTwdG11xHu1vZWVYQj21MPLrnw"

cluster:
  name: "mainnet-beta"
  rpc_urls: ["http://localhost:8899"]

prometheus:
  port: 9093
  health_check_port: 9094
  static_labels:
    environment: "demo"

failover:
  poll_interval_duration: "3s"
  leaderless_samples_threshold: 3  # 3 × 3s = 9s before failover

  self_healthy:
    minimum_duration: "5s"       # short for demo (default is 30s)
    poll_interval_duration: "2s"

  active:
    command: "curl"
    args:
      - "-sf"
      - "-X"
      - "POST"
      - "-H"
      - "Content-Type: application/json"
      - "-d"
      - '{"action":"set_active","target":"{{ .SelfName }}","profile":"{{ .ProfileName }}"}'
      - "http://localhost:8899/action"

  passive:
    command: "curl"
    args:
      - "-sf"
      - "-X"
      - "POST"
      - "-H"
      - "Content-Type: application/json"
      - "-d"
      - '{"action":"set_passive","target":"{{ .SelfName }}","profile":"{{ .ProfileName }}"}'
      - "http://localhost:8899/action"

profiles:
  main:
    priority: 0
    identities:
      active_pubkey: "ArkzFExXXHaA6izkNhTJJ5zpXdQpynffjfRMJu4Yq6H"
    vote_pubkey: "ArkzFExXXHaA6izkNhTJJ5zpXdQpynffjfRMJu4Yq6H"
    authorized_voter: "ArkzFExXXHaA6izkNhTJJ5zpXdQpynffjfRMJu4Yq6H"
    peers:
      validator-1:
        ip: "10.0.0.100"
      validator-2:
        ip: "10.0.0.101"
      validator-3:
        ip: "10.0.0.102"
