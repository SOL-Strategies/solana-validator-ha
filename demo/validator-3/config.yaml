# Configuration for solana-validator-ha binary to use with mock server
validator:
  name: validator-3
  rpc_url: http://localhost:8989/validator-3-rpc
  public_ip_service_urls:
    - http://localhost:8989/validator-3/public-ip
  identities:
    passive_pubkey: H4QkU478RymcAWa1NW22r9tRqbkjVrm14cobrfxGEXQV

cluster:
  name: mainnet-beta
  rpc_urls:
    - http://localhost:8989/solana-network-rpc
prometheus:
  port: 9099

failover:
  active:
    command: ../set-identity.sh
    args: ["3", active]
  passive:
    command: ../set-identity.sh
    args: ["3", passive]
profiles:
  main:
    priority: 0
    identities:
      active_pubkey: 7TCCEYMNjpRRdVQiMMYkNWJ9ECVThcUaw8mp11AWhTKe
    vote_pubkey: 7TCCEYMNjpRRdVQiMMYkNWJ9ECVThcUaw8mp11AWhTKe
    authorized_voter: 7TCCEYMNjpRRdVQiMMYkNWJ9ECVThcUaw8mp11AWhTKe
    peers:
      validator-1:
        ip: 192.168.1.101
      validator-2:
        ip: 192.168.1.102
      validator-3:
        ip: 192.168.1.103
